openapi: 3.0.3

info:
title: Course Management API
description: REST API for managing courses.
version: 1.0.0

servers:

  * url: http://localhost:8080

paths:

/courses:

  ```
get:
  summary: Get all courses
  description: Returns all available courses with pagination and sorting support.
  parameters:
    - name: page
      in: query
      description: Page number
      schema:
        type: integer
        default: 0

    - name: size
      in: query
      description: Number of records per page
      schema:
        type: integer
        default: 10

    - name: sort
      in: query
      description: Sort field and direction
      schema:
        type: string
        example: name,asc

  responses:
    '200':
      description: Courses retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Course'

post:
  summary: Create a new course
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Course'

  responses:
    '200':
      description: Course created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Course'
  ```

/courses/{id}:

  ```
get:
  summary: Get course by ID

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    '200':
      description: Course found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Course'

    '404':
      description: Course not found

put:
  summary: Update course

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Course'

  responses:
    '200':
      description: Course updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Course'

    '404':
      description: Course not found

delete:
  summary: Delete course

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    '200':
      description: Course deleted successfully

    '404':
      description: Course not found
  ```

components:

schemas:

  ```
Course:
  type: object

  properties:

    id:
      type: integer
      example: 1

    name:
      type: string
      example: Spring Boot Fundamentals
  ```
